<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CosmoSpark</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow-x: hidden;
    }
    .search-bar-container {
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(102, 126, 234, 0.25);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .search-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 24px;
      padding: 12px 20px;
      width: min(700px, 95%);
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .search-input-wrapper input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      color: #fff;
    }
    .search-input-wrapper input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    .clear-btn, .voice-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.8);
      flex-shrink: 0;
    }
    .glass-box {
      width: min(700px, 92%);
      margin: 2rem auto;
      padding: 24px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      overflow-wrap: anywhere;
    }
    .glass-box img, .glass-box video {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: min(700px, 90%);
      margin: 2rem 0 2rem 5%;
      max-height: calc(100vh - 130px);
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.35) rgba(255,255,255,0.08);
    }
    .results-container::-webkit-scrollbar {
      width: 8px;
    }
    .results-container::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
    }
    .results-container::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.35);
      border-radius: 10px;
    }
    .result-glass-box {
      width: 100%;
      padding: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      color: #fff;
      overflow-wrap: anywhere;
    }
    .result-glass-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      background: rgba(255, 255, 255, 0.22);
    }
    .result-title {
      font-size: 20px;
      color: #fff;
      text-decoration: none;
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .result-title:hover {
      text-decoration: underline;
    }
    .result-snippet {
      font-size: 14px;
      color: rgba(255,255,255,0.9);
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="search-bar-container">
    <form id="smart-search-form" class="search-form">
      <div class="search-input-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>

        <input
          id="search-input"
          type="text"
          name="q"
          placeholder="Search the web or type a URL"
          autocomplete="off"
          spellcheck="false"
          required
        />

        <button type="button" class="clear-btn" aria-label="Clear search" style="display: none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <button type="button" class="voice-btn" aria-label="Search by voice">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <div class="glass-box" id="default-content-box">
    <div id="app"></div>
  </div>

  <div id="results-container" class="results-container" style="display: none;"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
